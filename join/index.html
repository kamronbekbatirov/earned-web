<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Family - Earned</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            text-align: center;
        }
        .container { padding: 40px; }
        h1 { font-size: 2em; margin-bottom: 20px; }
        p { font-size: 1.2em; opacity: 0.9; }
        .code {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 1.5em;
            letter-spacing: 3px;
            margin: 20px 0;
            display: inline-block;
        }
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background: white;
            color: #11998e;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1em;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
    </style>
    <script>
        window.onload = function() {
            var path = window.location.pathname;
            var code = path.split('/').pop();
            
            // Показать код на странице
            if (code && code !== 'join') {
                var codeElement = document.getElementById('invite-code');
                if (codeElement) {
                    codeElement.textContent = code;
                }
                
                // Попытка открыть приложение
                setTimeout(function() {
                    window.location.href = 'earned://join/' + code;
                }, 100);
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>👨‍👩‍👧‍👦 Join Family</h1>
        <p>You've been invited to join a family on Earned!</p>
        <div class="code" id="invite-code">------</div>
        <p style="opacity: 0.7; font-size: 0.9em;">Opening app...</p>
        <a href="https://apps.apple.com/app/earned" class="btn">Download Earned</a>
    </div>
</body>
</html>
