<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Earned</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
        }
        .container { padding: 40px; }
        h1 { font-size: 2em; margin-bottom: 20px; }
        p { font-size: 1.2em; opacity: 0.9; }
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background: white;
            color: #764ba2;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1em;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
    </style>
    <script>
        window.onload = function() {
            var path = window.location.pathname;
            var code = path.split('/').pop();
            if (code && code !== 'invite') {
                // Попытка открыть приложение через custom URL scheme
                setTimeout(function() {
                    window.location.href = 'earned://invite/' + code;
                }, 100);
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>🎯 Earned</h1>
        <p>You've been invited to connect on Earned!</p>
        <p style="opacity: 0.7; font-size: 0.9em;">Opening app...</p>
        <a href="https://apps.apple.com/app/earned" class="btn">Download Earned</a>
    </div>
</body>
</html>
